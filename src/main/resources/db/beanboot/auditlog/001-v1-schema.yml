databaseChangeLog:
  - changeSet:
      id: 1
      author: m.szajner
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: true
              - column:
                  name: object_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: action
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: parameters
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
  - changeSet:
      id: 2
      author: initial
      changes:
        - addColumn:
            tableName: audit_logs
            columns:
              - column:
                  name: object_name
                  type: TEXT
              - column:
                  name: object_type
                  type: VARCHAR(255)
              - column:
                  name: user_name
                  type: TEXT
  - changeSet:
      id: 3
      author: m.szajner
      changes:
        - addColumn:
            tableName: audit_logs
            columns:
              - column:
                  name: message
                  type: TEXT
