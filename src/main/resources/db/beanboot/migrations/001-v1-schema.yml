databaseChangeLog:
  - changeSet:
      id: 1
      author: m.szajner
      changes:
        - createTable:
            tableName: migrations
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: started_at
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: finished_at
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: BIGINT
                  constraints:
                    nullable: false
